<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Presentationens titel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Roboto+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/magello.css">
<link rel="stylesheet" href="../../css/magello-deck.css">
</head>
<body>
<main class="deck" data-header="Tillfälle · Månad år">

  <section class="slide slide--title">
    <div class="slide__media"><img src="../../../assets/images/black-and-white/kontor-3.jpg" alt="Kollegor vid skrivbord bakom en krukväxt på kontoret"></div>
    <div class="plate">
      <span class="kicker">Etikett</span>
      <h1>Presentationens titel</h1>
      <p class="lead">En mening om vad det handlar om.</p>
      <p class="meta">Namn · Månad år</p>
    </div>
  </section>

  <section class="slide">
    <span class="kicker">Etikett</span>
    <h2>Rubriken är slutsatsen</h2>
    <ul>
      <li>Första punkten</li>
      <li>Andra punkten</li>
    </ul>
    <aside class="notes">
      <p>Talarmanus för bilden.</p>
    </aside>
  </section>

  <section class="slide slide--end">
    <h2>Tack!</h2>
    <p class="lead">namn@magello.se</p>
  </section>

</main>
<script src="../../js/magello-deck.js"></script>
</body>
</html>
